server:
  port: 8080

spring:
  application:
    name: yarn-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/yarn_manager_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: TiruppurHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Application JWT Configuration
app:
  jwt:
    # 256-bit Hex Key for HMAC-SHA256
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 Hours in milliseconds

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    root: INFO
    com.tiruppur.yarnmanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
